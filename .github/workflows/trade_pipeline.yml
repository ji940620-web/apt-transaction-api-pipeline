name: Trade Pipeline

on:
  schedule:
    - cron: '0 18 * * 0' # UTC 일요일 18시 (한국 시간 매주 월요일 새벽 3시)
  workflow_dispatch: # 수동 실행 버튼

jobs:
  run-etl:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # 1시간 넘으면 강제 종료 (6시간 사태 방지)
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # 3.10은 구글 라이브러리 지원 종료 경고가 떠서 상향

      - name: Install dependencies
        run: pip install pandas requests google-cloud-bigquery db-dtypes pyarrow

      - name: Run collector script
        env:
          DEAL_API_KEY: ${{ secrets.DEAL_API_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python src/incremental_collector.py